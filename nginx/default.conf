server {
    listen 80;
    server_name localhost your-domain.com;

    # ==========================
    # ✅ Serve React Frontend (build แล้ว)
    # ==========================
    root /usr/share/nginx/html;
    index index.html;

    # ==========================
    # ✅ FastAPI Backend #1 → /api/ → (Elasticsearch → PostgreSQL)
    # ==========================
    location /api/ {
        proxy_pass http://backend1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================
    # ✅ FastAPI Backend #2 → /postgres/ → (PostgreSQL → React ใช้ข้อมูลแสดงหน้าเว็บ)
    # ==========================
    location /postgres/ {
        proxy_pass http://backend2:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ รองรับ React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ Serve static assets (JS, CSS, รูปภาพ)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
    }
}
